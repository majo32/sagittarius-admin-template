name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build library
        run: npm run build:lib
      - name: Build demo (strict template type-check)
        run: npm run build:demo
      - name: Unit tests
        run: npm run test:ci
