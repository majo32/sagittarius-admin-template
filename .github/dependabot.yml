version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular a Material sa aktualizujú spolu, inak build zlyhá na nesúlade verzií
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "ng-packagr"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "ng-packagr"
    ignore:
      # Major verzie Angularu riešime ručne (ng update + úprava peerDependencies)
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
